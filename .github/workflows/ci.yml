name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: make fmt-check
      - run: make types-check
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --exclude latte-work-desktop --no-deps --locked
      - name: ShellCheck
        run: docker run --rm -v "${PWD}:/repo" -w /repo koalaman/shellcheck:v0.11.0 scripts/*.sh
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12

  host-check:
    name: Host check and Clippy (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude latte-work-desktop --all-targets --features latte-work-server/test-fixture --locked
      - run: cargo clippy --workspace --exclude latte-work-desktop --all-targets --features latte-work-server/test-fixture --locked -- -D warnings

  unit-tests:
    name: UT host (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude latte-work-desktop --lib --bins --locked

  e2e-host:
    name: E2E final server (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p latte-work-server --features test-fixture --test e2e --test native --test native_upgrade --test stdio_bridge --locked -- --test-threads=1

  portable-windows:
    name: Host core and portable Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p latte-work-windows-security -p latte-work-platform -p latte-work-config -p latte-work-protocol -p latte-work-client -p latte-work-server --features latte-work-server/test-fixture --all-targets --locked
      - run: cargo clippy -p latte-work-windows-security -p latte-work-platform -p latte-work-config -p latte-work-protocol -p latte-work-client -p latte-work-server --features latte-work-server/test-fixture --all-targets --locked -- -D warnings
      - run: ./scripts/test-windows-host.ps1
        shell: pwsh

  frontend:
    name: Frontend UT and build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run web-build

  release-server:
    name: Release server (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - if: runner.os != 'Windows'
        run: cargo build --release -p latte-work-server --locked
      - name: Build and verify Windows production Server
        if: runner.os == 'Windows'
        id: windows-server
        shell: pwsh
        run: ./scripts/build-windows-server.ps1
      - name: Test Windows Server artifact guardrails
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SERVER_ARTIFACT_DIRECTORY: ${{ steps.windows-server.outputs.artifact-directory }}
        run: ./scripts/test-windows-server-artifact.ps1 -ArtifactDirectory $env:SERVER_ARTIFACT_DIRECTORY
      - if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: latte-work-server-${{ matrix.label }}-${{ runner.arch }}
          path: target/release/latte-work-server
          if-no-files-found: error

      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: latte-work-server-${{ matrix.label }}-${{ runner.arch }}
          path: ${{ steps.windows-server.outputs.artifact-directory }}
          if-no-files-found: error

  desktop-native:
    name: macOS native desktop
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: WebKit site-data and favicon transport tests
        run: make test-native
        timeout-minutes: 3
      - run: make build

  desktop-native-windows:
    name: Windows x64 native desktop and NSIS
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Record native build environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native-evidence | Out-Null
          rustc -vV | Tee-Object -FilePath native-evidence/toolchain.txt
          if ($LASTEXITCODE -ne 0) { throw 'rustc failed' }
          cargo --version | Tee-Object -FilePath native-evidence/toolchain.txt -Append
          if ($LASTEXITCODE -ne 0) { throw 'cargo failed' }
          node --version | Tee-Object -FilePath native-evidence/toolchain.txt -Append
          if ($LASTEXITCODE -ne 0) { throw 'node failed' }
          npm --version | Tee-Object -FilePath native-evidence/toolchain.txt -Append
          if ($LASTEXITCODE -ne 0) { throw 'npm failed' }
      - name: Native desktop check with prepared sidecar
        shell: pwsh
        run: ./scripts/desktop.ps1 check 2>&1 | Tee-Object -FilePath native-evidence/check.log
      - name: Strict desktop and WebView Clippy
        shell: pwsh
        run: |
          cargo clippy -p latte-work-desktop -p latte-work-windows-webview --all-targets --locked -- -D warnings 2>&1 | Tee-Object -FilePath native-evidence/clippy.log
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop/WebView Clippy failed' }
      - name: Native desktop and WebView tests as an ordinary user
        shell: pwsh
        run: ./scripts/test-windows-host.ps1 -Suite Desktop 2>&1 | Tee-Object -FilePath native-evidence/desktop-webview-test.log
      - name: Native debug desktop build
        shell: pwsh
        run: ./scripts/desktop.ps1 build 2>&1 | Tee-Object -FilePath native-evidence/debug-build.log
      - name: Build fresh unsigned production NSIS package
        id: windows-package
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version=1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $packages = Join-Path $metadata.target_directory 'windows-package'
          $before = @()
          $beforeRuns = @()
          if (Test-Path -LiteralPath $packages) {
            $before = @(Get-ChildItem -LiteralPath $packages -Filter provenance.json -Recurse -File | Select-Object -ExpandProperty FullName)
            $beforeRuns = @(Get-ChildItem -LiteralPath $packages -Directory | Select-Object -ExpandProperty FullName)
          }
          try {
            ./scripts/desktop.ps1 package 2>&1 | Tee-Object -FilePath native-evidence/package.log
          } finally {
            if (Test-Path -LiteralPath $packages) {
              foreach ($run in @(Get-ChildItem -LiteralPath $packages -Directory | Where-Object { $_.FullName -notin $beforeRuns })) {
                $destination = Join-Path 'native-evidence/windows-package' $run.Name
                New-Item -ItemType Directory -Path $destination -Force | Out-Null
                foreach ($name in @('source-before.json', 'source-after.json', 'source-changes.txt')) {
                  $source = Join-Path $run.FullName $name
                  if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination $destination }
                }
              }
            }
          }
          $created = @(Get-ChildItem -LiteralPath $packages -Filter provenance.json -Recurse -File | Where-Object { $_.FullName -notin $before })
          if ($created.Count -ne 1) { throw 'Expected exactly one fresh successful package provenance' }
          $provenance = Get-Content -LiteralPath $created[0].FullName -Raw | ConvertFrom-Json
          "provenance-path=$($created[0].FullName)" >> $env:GITHUB_OUTPUT
          "installer-path=$($provenance.installer.path)" >> $env:GITHUB_OUTPUT
          "checksum-path=$($provenance.installer.checksum_path)" >> $env:GITHUB_OUTPUT
      - name: Verify NSIS payload and production provenance
        shell: pwsh
        env:
          PACKAGE_PROVENANCE: ${{ steps.windows-package.outputs.provenance-path }}
        run: ./scripts/verify-windows-package.ps1 -ProvenancePath $env:PACKAGE_PROVENANCE 2>&1 | Tee-Object -FilePath native-evidence/verify-package.log
      - name: Upload unsigned NSIS installer and provenance
        uses: actions/upload-artifact@v4
        with:
          name: latte-work-desktop-Windows-${{ runner.arch }}-nsis
          path: |
            ${{ steps.windows-package.outputs.installer-path }}
            ${{ steps.windows-package.outputs.checksum-path }}
            ${{ steps.windows-package.outputs.provenance-path }}
          if-no-files-found: error
      - name: Upload native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latte-work-desktop-Windows-${{ runner.arch }}-evidence
          path: native-evidence/
          if-no-files-found: error

  pr-gate:
    name: PR Gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - repository-quality
      - host-check
      - unit-tests
      - e2e-host
      - portable-windows
      - frontend
      - release-server
      - desktop-native
      - desktop-native-windows
    steps:
      - name: Require every CI layer to pass
        shell: bash
        env:
          QUALITY: ${{ needs.repository-quality.result }}
          HOST_CHECK: ${{ needs.host-check.result }}
          UNIT: ${{ needs.unit-tests.result }}
          E2E: ${{ needs.e2e-host.result }}
          PORTABLE_WINDOWS: ${{ needs.portable-windows.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RELEASE_SERVER: ${{ needs.release-server.result }}
          DESKTOP_NATIVE: ${{ needs.desktop-native.result }}
          DESKTOP_NATIVE_WINDOWS: ${{ needs.desktop-native-windows.result }}
        run: |
          failed=0
          for name in QUALITY HOST_CHECK UNIT E2E PORTABLE_WINDOWS FRONTEND RELEASE_SERVER DESKTOP_NATIVE DESKTOP_NATIVE_WINDOWS; do
            result="${!name}"
            if [[ "$result" != success ]]; then
              echo "::error::$name was $result; every PR Gate dependency must succeed"
              failed=1
            fi
          done
          exit "$failed"
